name: Push notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: cd tools && npm init -y >/dev/null && npm i --no-audit --no-fund firebase-admin@12
      - name: Send
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo "FIREBASE_SA secret is missing"; exit 0; fi
          node tools/notify.mjs
